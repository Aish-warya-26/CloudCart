name: CloudCart CI/CD

on:
  push:
    branches:
      - main

jobs:
  docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      ##################################################
      # PRODUCT SERVICE
      ##################################################

      - name: Build & Push Product Service
        uses: docker/build-push-action@v6
        with:
          context: ./product-service
          push: true
          tags: |
            aishwaryachourasia/cloudcart-product-service:latest
            aishwaryachourasia/cloudcart-product-service:${{ github.sha }}

      ##################################################
      # CART SERVICE
      ##################################################

      - name: Build & Push Cart Service
        uses: docker/build-push-action@v6
        with:
          context: ./cart-service
          push: true
          tags: |
            aishwaryachourasia/cloudcart-cart-service:latest
            aishwaryachourasia/cloudcart-cart-service:${{ github.sha }}

      ##################################################
      # ORDER SERVICE
      ##################################################

      - name: Build & Push Order Service
        uses: docker/build-push-action@v6
        with:
          context: ./order-service
          push: true
          tags: |
            aishwaryachourasia/cloudcart-order-service:latest
            aishwaryachourasia/cloudcart-order-service:${{ github.sha }}

      ##################################################
      # FRONTEND
      ##################################################

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            aishwaryachourasia/cloudcart-frontend:latest
            aishwaryachourasia/cloudcart-frontend:${{ github.sha }}