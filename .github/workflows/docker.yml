name: CloudCart CI

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    strategy:

      matrix:

        service:

          - product-service

          - cart-service

          - order-service

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4

      - name: Set up Docker Buildx

        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image

        run: |

          docker build -t ${{ matrix.service }} ./${{ matrix.service }}