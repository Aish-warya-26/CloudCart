apiVersion: apps/v1
kind: Deployment

metadata:
  name: product-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service

    spec:
      containers:
      - name: product-service
        image: aishwaryachourasia/cloudcart-product-service:latest
        imagePullPolicy: IfNotPresent 

        ports:
        - containerPort: 5000

        env:
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: cloudcart-config
              key: DATABASE_NAME

        - name: MONGO_URI
          value: mongodb://admin:password123@mongodb:27017/?authSource=admin